name: telegram-to-drive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync Telegram ke Drive
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SOURCE_CHAT: ${{ vars.SOURCE_CHAT }}
          DRIVE_FOLDER_NAME: ${{ vars.DRIVE_FOLDER_NAME }}
        run: python telegram_to_drive.py

      - name: Simpan state (dan keepalive)
        if: always()
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git push
          else
            last=$(git log -1 --format=%ct)
            now=$(date +%s)
            # GitHub menonaktifkan jadwal setelah 60 hari tanpa aktivitas repo
            if [ $((now - last)) -gt 3888000 ]; then
              git commit --allow-empty -m "keepalive"
              git push
            fi
          fi
